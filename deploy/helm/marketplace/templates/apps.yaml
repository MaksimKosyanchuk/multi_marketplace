apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marketplace.fullname" . }}-backend
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels:
      app: {{ include "marketplace.fullname" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "marketplace.fullname" . }}-backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.image.backend }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "npx prisma migrate deploy && npm run start:prod"]
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: CLIENT_URL
              value: http://{{ include "marketplace.fullname" . }}-frontend:{{ .Values.service.frontendPort }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "marketplace.fullname" . }}-secrets
                  key: DATABASE_URL
            - name: REDIS_HOST
              value: {{ include "marketplace.fullname" . }}-redis
            - name: REDIS_PORT
              value: {{ .Values.service.redisPort | quote }}
            - name: MEILISEARCH_URL
              value: http://{{ include "marketplace.fullname" . }}-meilisearch:{{ .Values.service.meilisearchPort }}
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "marketplace.fullname" . }}-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "marketplace.fullname" . }}-secrets
                  key: JWT_REFRESH_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "marketplace.fullname" . }}-backend
spec:
  selector:
    app: {{ include "marketplace.fullname" . }}-backend
  ports:
    - port: {{ .Values.service.backendPort }}
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marketplace.fullname" . }}-frontend
spec:
  replicas: {{ .Values.replicaCount.frontend }}
  selector:
    matchLabels:
      app: {{ include "marketplace.fullname" . }}-frontend
  template:
    metadata:
      labels:
        app: {{ include "marketplace.fullname" . }}-frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.image.frontend }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_URL
              value: http://{{ include "marketplace.fullname" . }}-backend:{{ .Values.service.backendPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "marketplace.fullname" . }}-frontend
spec:
  selector:
    app: {{ include "marketplace.fullname" . }}-frontend
  ports:
    - port: {{ .Values.service.frontendPort }}
      targetPort: 5173
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "marketplace.fullname" . }}
spec:
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "marketplace.fullname" . }}-backend
                port:
                  number: {{ .Values.service.backendPort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "marketplace.fullname" . }}-frontend
                port:
                  number: {{ .Values.service.frontendPort }}
{{- end }}
