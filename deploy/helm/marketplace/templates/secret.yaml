apiVersion: v1
kind: Secret
metadata:
  name: {{ include "marketplace.fullname" . }}-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ include "marketplace.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}?schema=public
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  JWT_ACCESS_SECRET: {{ .Values.jwt.accessSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.jwt.refreshSecret | quote }}
