services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketplace
    ports:
      - '5432:5432'
    volumes:
      - marketplace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d marketplace']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - marketplace

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - marketplace_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - marketplace

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: marketplace-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - marketplace_meilisearch_data:/meili_data
    networks:
      - marketplace

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketplace-backend
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && npm run start:dev"
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/marketplace?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEILISEARCH_URL: http://meilisearch:7700
      JWT_ACCESS_SECRET: insiders_jwt
      JWT_REFRESH_SECRET: insiders_refresh_jwt
      THROTTLE_DISABLED: ${THROTTLE_DISABLED:-false}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - marketplace

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketplace-frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3001
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - marketplace

volumes:
  marketplace_postgres_data:
  marketplace_redis_data:
  marketplace_meilisearch_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  marketplace:
    driver: bridge
