name: CI / Multi-Vendor Marketplace

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  infra-lint:
    name: Infrastructure Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Lint Backend Dockerfile
        run: docker build --check -f backend/Dockerfile backend/

      - name: Lint Frontend Dockerfile
        run: docker build --check -f frontend/Dockerfile frontend/


  unit-and-build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Cache Backend Node Modules
        uses: actions/cache@v4
        id: cache-backend
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Cache Frontend Node Modules
        uses: actions/cache@v4
        id: cache-frontend
        with:
          path: |
            frontend/node_modules
            frontend/node_modules/.vite
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install Backend Dependencies
        if: steps.cache-backend.outputs.cache-hit != 'true'
        working-directory: backend
        run: npm ci

      - name: Install Frontend Dependencies
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma
        working-directory: backend

      - name: Build Backend
        working-directory: backend
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: npm run build

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Run Backend Unit Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/marketplace_test?schema=public
          JWT_ACCESS_SECRET: insiders_jwt
          JWT_REFRESH_SECRET: insiders_refresh_jwt
        run: npm run test


  docker-tests:
    name: Docker Lint, E2E & Load Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Start Docker Environment
        env:
          DATABASE_URL: postgresql://postgres:password@postgres:5432/marketplace_test?schema=public
          REDIS_HOST: redis
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: insiders_jwt
          JWT_REFRESH_SECRET: insiders_refresh_jwt
        run: docker compose up -d --build

      - name: Show Docker Status
        run: docker compose ps

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: postgresql://postgres:password@postgres:5432/marketplace_test?schema=public
        run: docker compose exec -T backend npx prisma migrate deploy

      - name: Run Backend Linter
        run: docker compose exec -T backend npm run lint

      - name: Run Frontend Linter
        run: docker compose exec -T frontend npm run lint

      - name: Run Backend E2E Tests
        env:
          DATABASE_URL: postgresql://postgres:password@postgres:5432/marketplace_test?schema=public
          REDIS_HOST: redis
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: insiders_jwt
          JWT_REFRESH_SECRET: insiders_refresh_jwt
        run: docker compose exec -T backend npm run test:e2e

      - name: Run Backend Load Tests
        env:
          DATABASE_URL: postgresql://postgres:password@postgres:5432/marketplace_test?schema=public
          REDIS_HOST: redis
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: insiders_jwt
          JWT_REFRESH_SECRET: insiders_refresh_jwt
        run: docker compose exec -T backend npm run test:load

      - name: Show Docker Logs on Failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker Environment
        if: always()
        run: docker compose down -v