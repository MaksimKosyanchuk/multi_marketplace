name: CI / Multi-Vendor Marketplace

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  infra-lint:
    name: Infrastructure Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Lint Backend Dockerfile
        run: docker build --check -f backend/Dockerfile backend/

      - name: Lint Frontend Dockerfile
        run: docker build --check -f frontend/Dockerfile frontend/

  build-and-lint:
    name: Install, Lint, Test & Build Both
    needs: infra-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Backend Linter
        run: npm run lint
        working-directory: backend

      - name: Run Frontend Linter
        run: npm run lint
        working-directory: frontend

      - name: Run Frontend Tests
        run: npm run test --prefix frontend
        # Если тесты интерактивные или требуют CI-флага, замените на: npm run test -- --watchAll=false (для Jest/Vitest)

      - name: Build Backend Application
        run: npm run build --prefix backend

      - name: Build Frontend Application
        run: npm run build --prefix frontend
        env:
          VITE_API_URL: http://localhost:3001

  backend-test:
    name: Backend Tests & Load Tests
    needs: build-and-lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefix backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/marketplace_test?schema=public

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/marketplace_test?schema=public

      - name: Run Unit Tests
        run: npm run test --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/marketplace_test?schema=public
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: password
          DATABASE_NAME: marketplace_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: insiders_jwt
          JWT_REFRESH_SECRET: insiders_refresh_jwt
          CLIENT_URL: http://localhost:5173

      - name: Start Backend Server in Background
        run: |
          npm run start:prod --prefix backend &
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            nc -z localhost 3001 && echo "Backend is up!" && exit 0
            sleep 1
          done
          echo "Backend failed to start" && exit 1
        env:
          PORT: 3001
          DATABASE_URL: postgresql://postgres:password@localhost:5432/marketplace_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: insiders_jwt
          JWT_REFRESH_SECRET: insiders_refresh_jwt
          CLIENT_URL: http://localhost:5173

      - name: Run E2E Tests
        run: npm run test:e2e --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/marketplace_test?schema=public
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: password
          DATABASE_NAME: marketplace_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: insiders_jwt
          JWT_REFRESH_SECRET: insiders_refresh_jwt
          CLIENT_URL: http://localhost:5173

      - name: Run Load Tests
        run: npm run test:load --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/marketplace_test?schema=public
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: password
          DATABASE_NAME: marketplace_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: insiders_jwt
          JWT_REFRESH_SECRET: insiders_refresh_jwt
          CLIENT_URL: http://localhost:5173