name: CI / Multi-Vendor Marketplace

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  infra-lint:
    name: Infrastructure Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Verify Backend Lint Script
        working-directory: backend
        run: |
          node -e "const p=require('./package.json'); if (!p.scripts?.lint || p.scripts.lint.includes('--fix')) { console.error('Backend lint script must exist and must not contain --fix'); process.exit(1); }"

      - name: Verify Frontend Lint Script
        working-directory: frontend
        run: |
          node -e "const p=require('./package.json'); if (!p.scripts?.lint || p.scripts.lint.includes('--fix')) { console.error('Frontend lint script must exist and must not contain --fix'); process.exit(1); }"

      - name: Lint Backend Dockerfile
        run: docker build --check -f backend/Dockerfile backend/

      - name: Lint Frontend Dockerfile
        run: docker build --check -f frontend/Dockerfile frontend/

  unit-and-build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci --no-audit

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --no-audit

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Build Backend
        working-directory: backend
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: npm run build

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Run Backend Unit Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/marketplace_test?schema=public
          JWT_ACCESS_SECRET: insiders_jwt
          JWT_REFRESH_SECRET: insiders_refresh_jwt
        run: npm run test

  lint:
    name: Frontend & Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci --no-audit

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --no-audit

      - name: Run Backend Linter
        working-directory: backend
        run: npm run lint

      - name: Run Frontend Linter
        working-directory: frontend
        run: npm run lint