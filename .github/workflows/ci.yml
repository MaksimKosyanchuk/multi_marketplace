name: CI / Multi-Vendor Marketplace

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  infra-lint:
    name: Infrastructure Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Lint Backend Dockerfile
        run: docker build --check -f backend/Dockerfile backend/

      - name: Lint Frontend Dockerfile
        run: docker build --check -f frontend/Dockerfile frontend/

  unit-and-build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci --no-audit

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --no-audit

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Build Backend
        working-directory: backend
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: npm run build

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Run Backend Unit Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/marketplace_test?schema=public
          JWT_ACCESS_SECRET: insiders_jwt
          JWT_REFRESH_SECRET: insiders_refresh_jwt
        run: npm run test

  docker-tests:
    name: Docker Lint, E2E & Load Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Backend Docker Build
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-backend
          key: ${{ runner.os }}-docker-backend-v2-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-backend-v2-

      - name: Cache Frontend Docker Build
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-frontend
          key: ${{ runner.os }}-docker-frontend-v2-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-frontend-v2-

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: marketplace-backend:ci
          cache-from: type=local,src=/tmp/.buildx-cache-backend
          cache-to: type=local,dest=/tmp/.buildx-cache-backend-new,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: marketplace-frontend:ci
          cache-from: type=local,src=/tmp/.buildx-cache-frontend
          cache-to: type=local,dest=/tmp/.buildx-cache-frontend-new,mode=max

      - name: Replace Docker Build Cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache-backend
          if [ -d /tmp/.buildx-cache-backend-new ]; then
            mv /tmp/.buildx-cache-backend-new /tmp/.buildx-cache-backend
          fi

          rm -rf /tmp/.buildx-cache-frontend
          if [ -d /tmp/.buildx-cache-frontend-new ]; then
            mv /tmp/.buildx-cache-frontend-new /tmp/.buildx-cache-frontend
          fi

      - name: Build and Start Docker Environment
        env:
          DATABASE_URL: postgresql://postgres:password@postgres:5432/marketplace_test?schema=public
          REDIS_HOST: redis
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: insiders_jwt
          JWT_REFRESH_SECRET: insiders_refresh_jwt
        run: docker compose up -d

      - name: Show Docker Status
        run: docker compose ps

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: postgresql://postgres:password@postgres:5432/marketplace_test?schema=public
        run: docker compose exec -T backend npx prisma migrate deploy

      - name: Run Backend Linter
        run: docker compose exec -T backend npm run lint

      - name: Run Frontend Linter
        run: docker compose exec -T frontend npm run lint

      - name: Run Backend E2E Tests
        env:
          DATABASE_URL: postgresql://postgres:password@postgres:5432/marketplace_test?schema=public
          REDIS_HOST: redis
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: insiders_jwt
          JWT_REFRESH_SECRET: insiders_refresh_jwt
        run: docker compose exec -T backend npm run test:e2e

      - name: Run Backend Load Tests
        env:
          DATABASE_URL: postgresql://postgres:password@postgres:5432/marketplace_test?schema=public
          REDIS_HOST: redis
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: insiders_jwt
          JWT_REFRESH_SECRET: insiders_refresh_jwt
        run: docker compose exec -T backend npm run test:load

      - name: Show Docker Logs on Failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker Environment
        if: always()
        run: docker compose down -v