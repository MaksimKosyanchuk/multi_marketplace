services:
    postgres:
        image: postgres:16-alpine
        container_name: marketplace-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: marketplace
        ports:
            - '5432:5432'
        volumes:
            - marketplace_postgres_data:/var/lib/postgresql/data
        networks:
            - app-network

    redis:
        image: redis:7-alpine
        container_name: redis
        restart: unless-stopped
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        networks:
            - app-network

    backend:
        build: .
        container_name: marketplace-backend
        restart: unless-stopped
        command: sh -c "npx prisma migrate deploy && npm run start:dev"
        ports:
            - '3001:3001'
        environment:
            - NODE_ENV=development
            - PORT=3001
            - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/marketplace?schema=public
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        volumes:
            - .:/app
            - /app/node_modules
        depends_on:
            - postgres
            - redis
        networks:
            - app-network

volumes:
    marketplace_postgres_data:
    redis_data:

networks:
    app-network:
        driver: bridge